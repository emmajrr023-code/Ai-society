name: Build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
          ADMIN_SECRET: build-only-placeholder
          CRON_SECRET: build-only-placeholder
          AI_PROVIDER_API_KEY: build-only-placeholder
